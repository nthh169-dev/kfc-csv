<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" fill="none">
  <!-- Background warm circle -->
  <circle cx="240" cy="210" r="165" fill="#FFE6B3"/>
  <circle cx="240" cy="210" r="130" fill="#FFD480" opacity="0.55"/>

  <!-- Steam curves -->
  <path d="M175 68C168 52 184 42 177 26" stroke="#E4002B" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <path d="M240 54C233 38 249 28 242 12" stroke="#F5B301" stroke-width="5" stroke-linecap="round"/>
  <path d="M305 68C298 52 314 42 307 26" stroke="#E4002B" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

  <!-- Golden Fries peeking on left -->
  <g transform="rotate(-14 150 155)">
    <rect x="118" y="105" width="18" height="78" rx="6" fill="#F5B301" stroke="#1F1A17" stroke-width="4"/>
    <rect x="140" y="92" width="18" height="86" rx="6" fill="#FFD24C" stroke="#1F1A17" stroke-width="4"/>
    <rect x="162" y="102" width="18" height="76" rx="6" fill="#F5B301" stroke="#1F1A17" stroke-width="4"/>
  </g>

  <!-- Crispy drumsticks inside bucket -->
  <g transform="rotate(-18 205 145)">
    <rect x="168" y="88" width="22" height="52" rx="10" fill="#FFF6E5" stroke="#1F1A17" stroke-width="4"/>
    <circle cx="168" cy="88" r="10" fill="#FFF6E5" stroke="#1F1A17" stroke-width="4"/>
    <circle cx="190" cy="88" r="10" fill="#FFF6E5" stroke="#1F1A17" stroke-width="4"/>
    <ellipse cx="182" cy="155" rx="42" ry="50" fill="#E8891E" stroke="#1F1A17" stroke-width="4"/>
    <circle cx="168" cy="142" r="8" fill="#F5B301"/>
    <circle cx="194" cy="156" r="6" fill="#F5B301"/>
  </g>

  <g transform="rotate(16 290 145)">
    <rect x="292" y="84" width="22" height="52" rx="10" fill="#FFF6E5" stroke="#1F1A17" stroke-width="4"/>
    <circle cx="292" cy="84" r="10" fill="#FFF6E5" stroke="#1F1A17" stroke-width="4"/>
    <circle cx="314" cy="84" r="10" fill="#FFF6E5" stroke="#1F1A17" stroke-width="4"/>
    <ellipse cx="300" cy="152" rx="44" ry="52" fill="#D97214" stroke="#1F1A17" stroke-width="4"/>
    <circle cx="288" cy="138" r="7" fill="#F5B301"/>
    <circle cx="312" cy="154" r="9" fill="#F5B301"/>
  </g>

  <!-- Center crispy wing/piece -->
  <ellipse cx="242" cy="162" rx="52" ry="42" fill="#F59B23" stroke="#1F1A17" stroke-width="4"/>
  <path d="M215 152C225 142 242 142 252 152" stroke="#FFF6E5" stroke-width="4" stroke-linecap="round"/>
  <circle cx="264" cy="164" r="7" fill="#FFD24C"/>

  <!-- Bucket shadow -->
  <ellipse cx="240" cy="364" rx="112" ry="16" fill="#1F1A17" opacity="0.14"/>

  <!-- Classic Striped Bucket -->
  <polygon points="124,176 356,176 324,354 156,354" fill="#E4002B" stroke="#1F1A17" stroke-width="5" stroke-linejoin="round"/>
  <!-- White stripes -->
  <polygon points="172,176 206,176 196,354 168,354" fill="#FFFFFF"/>
  <polygon points="274,176 308,176 312,354 284,354" fill="#FFFFFF"/>
  <!-- Re-stroke bucket border -->
  <polygon points="124,176 356,176 324,354 156,354" fill="none" stroke="#1F1A17" stroke-width="5" stroke-linejoin="round"/>

  <!-- Bucket Rim -->
  <rect x="112" y="162" width="256" height="22" rx="11" fill="#FFFFFF" stroke="#1F1A17" stroke-width="5"/>

  <!-- Center Wordmark Badge on Bucket -->
  <rect x="190" y="232" width="100" height="56" rx="14" fill="#FFF6E5" stroke="#1F1A17" stroke-width="4"/>
  <text x="240" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="24" fill="#E4002B">GIÒN!</text>

  <!-- Sparkle stars -->
  <circle cx="94" cy="132" r="8" fill="#F5B301"/>
  <circle cx="388" cy="126" r="10" fill="#E4002B"/>
  <circle cx="396" cy="248" r="7" fill="#F5B301"/>
  <circle cx="88" cy="262" r="6" fill="#E4002B"/>
</svg>
